name: False alarm
description: BaitBox flagged something that is normal.
labels: [false-alarm]
body:
  - type: textarea
    id: finding
    attributes:
      label: The finding
      description: Paste the exact line from report.md, scan.txt, deps.txt or sandbox.txt.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is normal
      description: For example, which popular package or tool does this, and a link to its source.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BaitBox version
      placeholder: baitbox --version
