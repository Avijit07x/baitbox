[project]
name = "baitbox"
version = "0.1.0"
description = "Malware scanner and sandbox for untrusted Node.js projects."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Avijit07x" }]
keywords = ["security", "malware", "npm", "supply-chain", "sandbox", "bubblewrap", "strace"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/Avijit07x/baitbox"
Issues = "https://github.com/Avijit07x/baitbox/issues"

[tool.ruff]
line-length = 200
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101", "S603", "S607", "S108", "S310", "E501", "B007", "UP015"]

[tool.ruff.lint.per-file-ignores]
"src/baitbox/__main__.py" = ["E402"]
"tests/*" = ["S", "B"]

[tool.ruff.lint.isort]
known-first-party = ["baitbox", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
